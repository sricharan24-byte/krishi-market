<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Forgot Password | Krishi Market
    </title>

    <link
        rel="stylesheet"
        href="css/auth.css"
    >

</head>


<body>

<div class="auth-page">

    <div class="auth-container">

        <h1>
            🌾 Krishi Market
        </h1>


        <h2>
            Forgot Password
        </h2>


        <p>
            Enter your registered email address.
            We will send you an OTP.
        </p>


        <form id="forgotPasswordForm">

            <label>
                Email Address
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >


            <button type="submit">

                Send OTP

            </button>

        </form>


        <p id="message"></p>


        <a href="login.html">
            Back to Login
        </a>

    </div>

</div>


<script src="js/config.js"></script>
<script>

const form =
    document.getElementById(
        "forgotPasswordForm"
    );


form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const email =
            document
                .getElementById("email")
                .value
                .trim();


        try {
            const forgotUrl = (typeof config !== "undefined" && config.endpoints && config.endpoints.auth.forgotPassword)
                ? config.endpoints.auth.forgotPassword
                : (typeof window !== "undefined" && window.location && window.location.protocol.startsWith("http"))
                    ? (!window.location.port || window.location.port === "5000" || window.location.port === "80" || window.location.port === "443")
                        ? `${window.location.origin}/api/auth/forgot-password`
                        : `${window.location.protocol}//${window.location.hostname}:5000/api/auth/forgot-password`
                    : "http://localhost:5000/api/auth/forgot-password";

            const response =
                await fetch(
                    forgotUrl,
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body: JSON.stringify({
                            email: email
                        })

                    }
                );


            const data =
                await response.json();


            if (data.success) {

                alert(
                    "OTP sent to your email"
                );


                // Save email temporarily

                sessionStorage.setItem(
                    "resetEmail",
                    email
                );


                // Go to OTP page

                window.location.href =
                    "verify-otp.html";


            } else {

                alert(
                    data.message
                );

            }


        } catch (error) {

            console.error(error);


            alert(
                "Unable to connect to server"
            );

        }

    }
);

</script>

</body>

</html>
