<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Krishi Market</title>
  <link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/admin.css"><link rel="stylesheet" href="../css/responsive.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="admin-logo"><i class="fas fa-leaf"></i><span>Krishi Admin</span></div>
      <nav class="admin-nav">
        <a href="dashboard.html" class="active"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
        <a href="users.html"><i class="fas fa-users"></i> Users</a>
        <a href="farmers.html"><i class="fas fa-tractor"></i> Farmers</a>
        <a href="products.html"><i class="fas fa-box"></i> Products</a>
        <a href="orders.html"><i class="fas fa-shopping-cart"></i> Orders</a>
        <a href="reports.html"><i class="fas fa-chart-bar"></i> Reports</a>
        <a href="../index.html"><i class="fas fa-home"></i> Back to Site</a>
        <a href="#" onclick="auth.logout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
      </nav>
    </aside>
    <main class="admin-content">
      <div class="admin-header"><h1>Dashboard</h1></div>
      <div class="admin-stats">
        <div class="admin-stat-card"><div class="stat-icon" style="background:#dbeafe;color:#2563eb;"><i class="fas fa-users"></i></div><div class="stat-info"><h3 id="totalUsers">0</h3><p>Total Users</p></div></div>
        <div class="admin-stat-card"><div class="stat-icon" style="background:#dcfce7;color:#16a34a;"><i class="fas fa-tractor"></i></div><div class="stat-info"><h3 id="totalFarmers">0</h3><p>Total Farmers</p></div></div>
        <div class="admin-stat-card"><div class="stat-icon" style="background:#fef3c7;color:#d97706;"><i class="fas fa-box"></i></div><div class="stat-info"><h3 id="totalProducts">0</h3><p>Total Products</p></div></div>
        <div class="admin-stat-card"><div class="stat-icon" style="background:#f3e8ff;color:#7c3aed;"><i class="fas fa-shopping-cart"></i></div><div class="stat-info"><h3 id="totalOrders">0</h3><p>Total Orders</p></div></div>
      </div>
    </main>
  </div>
  <script src="../js/config.js"></script><script src="../js/auth.js"></script><script src="dashboard.js"></script>
</body>
</html>
