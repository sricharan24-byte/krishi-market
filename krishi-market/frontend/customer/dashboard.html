<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Dashboard - Krishi Market</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/customer.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <header>
    <nav class="navbar">
      <div class="container">
        <a href="../index.html" class="logo"><i class="fas fa-leaf"></i><span>Krishi Market</span></a>
        <div class="nav-links">
          <a href="../index.html">Home</a>
          <a href="../products.html">Products</a>
          <a href="../cart.html">Cart <span id="cartCount">0</span></a>
          <a href="dashboard.html" class="active">Dashboard</a>
          <a href="#" onclick="auth.logout()">Logout</a>
        </div>
        <div class="hamburger"><span></span><span></span><span></span></div>
      </div>
    </nav>
  </header>

  <section class="dashboard">
    <div class="container">
      <div class="dashboard-header">
        <h1>My Dashboard</h1>
        <a href="../products.html" class="btn btn-primary"><i class="fas fa-plus"></i> Browse Products</a>
      </div>
      <div class="dashboard-grid" id="statsGrid">
        <div class="dashboard-card"><i class="fas fa-shopping-bag"></i><h3 id="totalOrders">0</h3><p>Total Orders</p></div>
        <div class="dashboard-card"><i class="fas fa-heart"></i><h3 id="wishlistCount">0</h3><p>Wishlist</p></div>
        <div class="dashboard-card"><i class="fas fa-clock"></i><h3 id="pendingOrders">0</h3><p>Pending Orders</p></div>
        <div class="dashboard-card"><i class="fas fa-check-circle"></i><h3 id="deliveredOrders">0</h3><p>Delivered</p></div>
      </div>

      <h2>Recent Orders</h2>
      <div class="orders-table" id="recentOrders">
        <table><thead><tr><th>Order ID</th><th>Date</th><th>Total</th><th>Status</th><th>Action</th></tr></thead><tbody id="ordersBody"></tbody></table>
      </div>
    </div>
  </section>

  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
