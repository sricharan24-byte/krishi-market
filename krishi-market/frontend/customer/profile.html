<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - Krishi Market</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/customer.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <header>
    <nav class="navbar">
      <div class="container">
        <a href="../index.html" class="logo"><i class="fas fa-leaf"></i><span>Krishi Market</span></a>
        <div class="nav-links">
          <a href="../index.html">Home</a><a href="../products.html">Products</a><a href="../cart.html">Cart <span id="cartCount">0</span></a>
          <a href="dashboard.html">Dashboard</a><a href="profile.html" class="active">Profile</a><a href="#" onclick="auth.logout()">Logout</a>
        </div>
        <div class="hamburger"><span></span><span></span><span></span></div>
      </div>
    </nav>
  </header>
  <section class="profile-section">
    <div class="container">
      <div class="profile-card">
        <div class="profile-header">
          <div class="profile-avatar" id="avatarInitial">U</div>
          <div><h2 id="profileName">User</h2><p id="profileEmail">email@example.com</p></div>
        </div>
        <form id="profileForm">
          <div class="form-group"><label>Name</label><input type="text" id="editName" required></div>
          <div class="form-group"><label>Email</label><input type="email" id="editEmail" required></div>
          <div class="form-group"><label>Phone</label><input type="tel" id="editPhone"></div>
          <div class="form-group"><label>Street</label><input type="text" id="editStreet"></div>
          <div class="form-row">
            <div class="form-group"><label>City</label><input type="text" id="editCity"></div>
            <div class="form-group"><label>State</label><input type="text" id="editState"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>ZIP Code</label><input type="text" id="editZip"></div>
            <div class="form-group"><label>Country</label><input type="text" id="editCountry" value="India"></div>
          </div>
          <button type="submit" class="btn btn-primary">Update Profile</button>
        </form>
      </div>
    </div>
  </section>
  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="profile.js"></script>
</body>
</html>
