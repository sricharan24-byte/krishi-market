<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Logging Out | Krishi Market</title>

    <link rel="stylesheet" href="logout.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1f7a3f, #4caf50);
        }

        .logout-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .logout-card {
            width: 420px;
            max-width: 100%;
            background: #ffffff;
            padding: 45px 35px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
        }

        .logout-icon {
            width: 85px;
            height: 85px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #e9f8ec;
            color: #1f7a3f;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
        }

        .logout-card h1 {
            color: #1f7a3f;
            font-size: 27px;
            margin-bottom: 12px;
        }

        .logout-card p {
            color: #777;
            font-size: 15px;
            line-height: 1.6;
        }

        .redirect-message {
            margin-top: 8px;
        }

        .loader {
            width: 45px;
            height: 45px;
            border: 4px solid #e5e5e5;
            border-top: 4px solid #1f7a3f;
            border-radius: 50%;
            margin: 25px auto;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .login-btn {
            display: inline-block;
            text-decoration: none;
            background: #1f7a3f;
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: 600;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: #166331;
            transform: translateY(-2px);
        }

    </style>
</head>

<body>

    <div class="logout-container">

        <div class="logout-card">

            <div class="logout-icon">
                ✓
            </div>

            <h1>Logged Out Successfully</h1>

            <p>
                Your farmer account has been logged out successfully.
            </p>

            <p class="redirect-message">
                Redirecting you to the login page...
            </p>

            <div class="loader"></div>

            <a href="../login.html" class="login-btn">
                Go to Login
            </a>

        </div>

    </div>


    <script>

        // Remove login/session information
        localStorage.clear();
        sessionStorage.clear();

        // Redirect to frontend/login.html
        setTimeout(function () {

            window.location.replace("../login.html");

        }, 1500);

    </script>

</body>

</html>
