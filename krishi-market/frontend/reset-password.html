<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Reset Password | Krishi Market
    </title>

</head>


<body>


<h1>
    Create New Password
</h1>


<form id="resetPasswordForm">


    <label>
        New Password
    </label>


    <input
        type="password"
        id="newPassword"
        placeholder="Enter new password"
        required
    >


    <label>
        Confirm New Password
    </label>


    <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm new password"
        required
    >


    <button type="submit">
        Reset Password
    </button>


</form>


<script>

const email =
    sessionStorage.getItem(
        "resetEmail"
    );


const otp =
    sessionStorage.getItem(
        "resetOTP"
    );


if (!email || !otp) {

    window.location.href =
        "forgot-password.html";

}


document
    .getElementById("resetPasswordForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const newPassword =
                document
                    .getElementById(
                        "newPassword"
                    )
                    .value;


            const confirmPassword =
                document
                    .getElementById(
                        "confirmPassword"
                    )
                    .value;


            if (
                newPassword !==
                confirmPassword
            ) {

                alert(
                    "Passwords do not match"
                );

                return;

            }


            try {

                const response =
                    await fetch(
                        "http://localhost:5000/api/auth/reset-password",
                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body: JSON.stringify({

                                email:
                                    email,

                                otp:
                                    otp,

                                newPassword:
                                    newPassword

                            })

                        }
                    );


                const data =
                    await response.json();


                if (data.success) {

                    alert(
                        "Password reset successfully!"
                    );


                    // Clear reset information

                    sessionStorage.removeItem(
                        "resetEmail"
                    );

                    sessionStorage.removeItem(
                        "resetOTP"
                    );


                    // Go to login

                    window.location.href =
                        "login.html";


                } else {

                    alert(
                        data.message
                    );

                }


            } catch (error) {

                console.error(error);


                alert(
                    "Unable to connect to server"
                );

            }

        }
    );

</script>


</body>

</html>
