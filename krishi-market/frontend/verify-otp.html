<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Verify OTP | Krishi Market
    </title>

</head>


<body>


<h1>
    Verify OTP
</h1>


<p>
    Enter the OTP sent to your email.
</p>


<form id="otpForm">

    <input
        type="text"
        id="otp"
        placeholder="Enter 6-digit OTP"
        maxlength="6"
        required
    >


    <button type="submit">
        Verify OTP
    </button>

</form>


<script>

const email =
    sessionStorage.getItem(
        "resetEmail"
    );


if (!email) {

    window.location.href =
        "forgot-password.html";

}


document
    .getElementById("otpForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const otp =
                document
                    .getElementById("otp")
                    .value
                    .trim();


            try {

                const response =
                    await fetch(
                        "http://localhost:5000/api/auth/verify-otp",
                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body: JSON.stringify({

                                email: email,

                                otp: otp

                            })

                        }
                    );


                const data =
                    await response.json();


                if (data.success) {

                    sessionStorage.setItem(
                        "resetOTP",
                        otp
                    );


                    window.location.href =
                        "reset-password.html";


                } else {

                    alert(
                        data.message
                    );

                }


            } catch (error) {

                console.error(error);

                alert(
                    "Unable to connect to server"
                );

            }

        }
    );

</script>


</body>

</html>
